paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  external_dir: "data/external"
universe:
  source: "sp500"
date_range:
  start: "2023-01-01"
  end: "2023-06-30"
tickers: ["AAPL", "MSFT", "GOOGL", "AMZN", "TSLA", "NVDA", "META", "JPM", "JNJ", "V",
         "UNH", "XOM", "WMT", "PG", "MA", "HD", "CVX", "ABBV", "LLY", "BAC"]
yfinance:
  batch_size: 50
  sleep_between_batches: 1.0
  retry_attempts: 3
gdelt:
  tone_columns: ["overall", "positive", "negative", "polarity", "activity", "self_group"]
  entity_match_threshold: 80
  decay_halflife_days: 3
features:
  technical_indicators:
    - "sma_5"
    - "sma_20"
    - "rsi_14"
    - "macd"
    - "bb_upper"
    - "bb_lower"
    - "volatility_21d"
    - "momentum_12m"
logging:
  level: "INFO"
  file: "logs/data_pipeline.log"
model:
  num_layers: 3
  hidden_channels: 64
  num_heads: 4
  window_size: 25
training:
  epochs: 5
  batch_size: 4
  learning_rate: 0.001
  weight_decay: 0.00001
backtest:
  transaction_cost_bps: 10.0
  rebalance_frequency: "weekly"
